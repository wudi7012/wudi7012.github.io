{% if page.last_modified_at %}
<footer class="page__last-updated" aria-label="Page information">
  <div class="page__last-updated-badge">
    <svg class="page__last-updated-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <rect x="3.5" y="5.5" width="17" height="15" rx="3" />
      <path d="M7.5 3.5v4M16.5 3.5v4M3.5 10.5h17M8 14.5h3M8 17.5h6" />
    </svg>
    <div class="page__last-updated-text">
      <span class="page__last-updated-label">Last updated</span>
      <time datetime="{{ page.last_modified_at | date: '%Y-%m-%d' }}" itemprop="dateModified">{{ page.last_modified_at | date: '%B %-d, %Y' }}</time>
    </div>
  </div>
</footer>
{% endif %}
